<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Video Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }
    </style>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen flex flex-col overflow-hidden transition-colors duration-700">

    <!-- LOGIN PANEL -->
    <div id="login-panel" class="w-full h-screen flex flex-col items-center justify-center p-4 transition-all duration-500 relative z-10">
        
        <h1 class="text-5xl md:text-7xl lg:text-8xl font-black tracking-tighter mb-12 text-center text-white">KNOX 2026 FINAL VIDEO</h1>
        
        <div class="flex flex-row items-center justify-center w-full max-w-lg relative">
            <input 
                type="password" 
                id="password-input" 
                placeholder="Enter password..." 
                class="flex-1 bg-zinc-900 border border-zinc-700 text-white px-4 py-4 text-xl focus:outline-none focus:border-zinc-400 transition-colors placeholder:text-zinc-600 rounded-l-md"
            >
            <button 
                id="unlock-btn" 
                class="bg-zinc-100 text-zinc-950 font-bold px-8 py-4 text-xl hover:bg-white transition-colors duration-200 focus:outline-none rounded-r-md border border-zinc-100"
            >
                ENTER
            </button>
            <p id="error-message" class="text-red-500 text-sm absolute -bottom-8 left-0 opacity-0 transition-opacity">Incorrect password.</p>
        </div>
    </div>

    <!-- SECURE CONTENT (Hidden by default) -->
    <div id="secure-content" class="hidden w-full h-screen flex-col items-center justify-center p-0 md:p-8 relative z-0 animate-fade-in bg-black" style="display: none;">
        
        <div class="w-full h-full max-w-[100rem] mx-auto flex flex-col relative pt-16 md:pt-0">
            <!-- Lock Button Overlay -->
            <button id="lock-btn" class="absolute top-4 right-4 z-20 flex items-center gap-2 text-zinc-400 hover:text-white transition-colors text-sm font-medium px-4 py-2 rounded-lg bg-zinc-900/80 backdrop-blur border border-zinc-800 hover:border-zinc-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
                Lock Vault
            </button>
            
            <!-- Video Container (Fills remaining space) -->
            <div class="relative w-full h-full bg-black md:rounded-xl overflow-hidden shadow-2xl border border-white/5 group flex-1">
                <!-- Placeholder/Loader before iframe injects -->
                <div id="video-loader" class="absolute inset-0 flex items-center justify-center z-0">
                    <div class="w-8 h-8 border-2 border-zinc-700 border-t-zinc-300 rounded-full animate-spin"></div>
                </div>
                
                <!-- Iframe Container -->
                <div id="iframe-container" class="absolute inset-0 z-10 w-full h-full"></div>
            </div>

            <!-- Extras Link Button -->
            <div class="w-full flex justify-center mt-6 mb-4 md:mb-0 pb-4 md:pb-0 z-10 shrink-0">
                <a 
                    href="https://drive.google.com/drive/folders/1fCSjMImRhet6ULallXj4uWht0NZJZWMn?usp=sharing" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="bg-zinc-900 border border-zinc-700 hover:border-zinc-400 text-zinc-400 hover:text-white px-8 py-4 text-sm font-semibold tracking-widest uppercase transition-all duration-200 rounded-md shadow-lg"
                >
                    extras and outtakes
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const TARGET_PASSWORD = 'knoxsnrs@26';
            const YOUTUBE_VIDEO_ID = '4-EwNjfq6bI'; 
            
            // DOM Elements
            const loginPanel = document.getElementById('login-panel');
            const secureContent = document.getElementById('secure-content');
            const passwordInput = document.getElementById('password-input');
            const unlockBtn = document.getElementById('unlock-btn');
            const lockBtn = document.getElementById('lock-btn');
            const errorMessage = document.getElementById('error-message');
            const iframeContainer = document.getElementById('iframe-container');
            const body = document.body;

            // Handle Unlock Attempt
            function attemptUnlock() {
                const enteredPassword = passwordInput.value;
                
                if (enteredPassword === TARGET_PASSWORD) {
                    // Success
                    errorMessage.style.opacity = '0';
                    loginPanel.classList.remove('animate-shake'); // reset shake if any
                    
                    // Transition View
                    loginPanel.style.opacity = '0';
                    loginPanel.style.transform = 'scale(0.95)';
                    
                    setTimeout(() => {
                        loginPanel.style.display = 'none';
                        secureContent.style.display = 'flex';
                        body.classList.remove('overflow-hidden');
                        
                        // Inject iframe dynamically to prevent it from loading in the background
                        injectVideo();
                    }, 400); // Wait for fade out
                    
                } else {
                    // Failure
                    passwordInput.value = '';
                    errorMessage.style.opacity = '1';
                    
                    // Trigger shake animation
                    loginPanel.classList.remove('animate-shake');
                    void loginPanel.offsetWidth; // Trigger reflow to restart animation
                    loginPanel.classList.add('animate-shake');
                }
            }

            // Inject the YouTube Iframe
            function injectVideo() {
                if (iframeContainer.innerHTML === '') {
                    // vq=hd2160 requests 4K, autoplay=1 starts it when revealed
                    const iframeHTML = `
                        <iframe 
                            class="w-full h-full"
                            src="https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&vq=hd2160&rel=0&modestbranding=1" 
                            title="4K Video Viewer" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin" 
                            allowfullscreen>
                        </iframe>
                    `;
                    iframeContainer.innerHTML = iframeHTML;
                }
            }
            
            // Handle Lock Attempt
            function lockVault() {
                // Clear video to stop playing/downloading
                iframeContainer.innerHTML = '';
                passwordInput.value = '';
                
                // Transition View
                secureContent.style.display = 'none';
                loginPanel.style.display = 'flex';
                body.classList.add('overflow-hidden');
                
                // Slight delay to allow display block to take effect before animating opacity
                setTimeout(() => {
                    loginPanel.style.opacity = '1';
                    loginPanel.style.transform = 'scale(1)';
                }, 50);
            }

            // Event Listeners
            unlockBtn.addEventListener('click', attemptUnlock);
            
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    attemptUnlock();
                }
            });

            // Hide error message on input change
            passwordInput.addEventListener('input', () => {
                errorMessage.style.opacity = '0';
            });
            
            lockBtn.addEventListener('click', lockVault);
        });
    </script>
</body>
</html>
